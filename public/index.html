<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Session Tracker</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --panel-2:#171b25; --border:#222736;
          --text:#e8eaf1; --dim:#8b91a0; --accent:#7aa2f7; --accent-soft:#1c2740;
          --busy:#34d399; --idle:#fbbf24; --ended:#4b5163; }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  header { position:sticky; top:0; z-index:10;
           background:color-mix(in srgb, var(--bg) 85%, transparent);
           backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
           border-bottom:1px solid var(--border);
           padding:14px 24px 12px; display:flex; flex-direction:column; gap:10px; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap }
  h1 { font-size:15px; font-weight:600; letter-spacing:.02em; margin:0 10px 0 0;
       display:flex; align-items:center; gap:8px }
  h1::before { content:''; width:8px; height:8px; border-radius:50%;
               background:var(--accent); box-shadow:0 0 10px var(--accent) }
  input#nameFilter { background:var(--panel); color:var(--text); width:230px;
          border:1px solid var(--border); border-radius:8px; padding:7px 12px;
          outline:none; transition:border-color .15s ease; }
  input#nameFilter::placeholder { color:var(--dim) }
  input#nameFilter:focus { border-color:var(--accent) }
  label.toggle { display:flex; gap:6px; align-items:center; color:var(--dim);
                 cursor:pointer; user-select:none }
  .counts { margin-left:auto; color:var(--dim); font-size:13px;
            font-variant-numeric:tabular-nums }

  .filter-row { display:flex; align-items:flex-start; gap:10px }
  .row-label { flex:none; width:62px; padding-top:5px; font-size:11px;
               font-weight:600; text-transform:uppercase; letter-spacing:.09em;
               color:var(--dim) }
  .pills { display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex:1; min-width:0 }
  .hint { color:var(--dim); font-size:13px; padding:3px 0 }

  .pill { background:transparent; color:var(--dim); border:1px solid var(--border);
          border-radius:999px; padding:3px 13px; cursor:pointer; font-size:13px;
          transition:border-color .12s ease, background-color .12s ease, color .12s ease }
  .pill:hover { border-color:var(--dim); color:var(--text) }
  .pill.active { background:var(--accent); border-color:var(--accent); color:#0b0d12 }
  .pill.group { border-color:color-mix(in srgb, var(--accent) 45%, var(--border));
                color:var(--accent); font-weight:600 }
  .pill.group:hover { border-color:var(--accent) }
  .pill.group.active { background:var(--accent); color:#0b0d12 }
  .pill.group.editing { background:var(--accent-soft); color:var(--text);
                        border-style:dashed; border-color:var(--accent) }
  .pill.member { border-color:var(--busy); color:var(--busy) }
  .pill .x { margin-left:8px; opacity:.6 }
  .pill .x:hover { opacity:1 }

  button.edit-toggle { flex:none; background:transparent; color:var(--dim);
          border:1px solid transparent; border-radius:8px; padding:4px 10px;
          cursor:pointer; font-size:13px;
          transition:border-color .12s ease, color .12s ease, background-color .12s ease }
  button.edit-toggle:hover { color:var(--text); border-color:var(--border) }
  button.edit-toggle.active { color:var(--accent); border-color:var(--accent);
          background:var(--accent-soft) }

  main { padding:18px 24px 40px }
  .card { background:var(--panel); border:1px solid var(--border);
          border-radius:12px; overflow:hidden }
  table { width:100%; border-collapse:collapse }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--border);
           vertical-align:top }
  tr:last-child td { border-bottom:none }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase;
       letter-spacing:.08em; background:var(--panel-2) }
  tbody tr:hover { background:var(--panel-2) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px }
  tr.busy .dot { background:var(--busy); box-shadow:0 0 8px var(--busy) }
  tr.idle .dot { background:var(--idle) }
  tr.ended .dot { background:var(--ended) }
  tr.ended td { color:var(--dim) }
  td.time { font-variant-numeric:tabular-nums; white-space:nowrap }
  .id { font-family:ui-monospace, SFMono-Regular, monospace; cursor:pointer;
        color:var(--accent) }
  .id:hover { text-decoration:underline }

  .recap-panel { background:var(--panel-2); border:1px solid var(--border);
                 border-radius:10px; padding:10px 14px; margin:2px 0 6px;
                 white-space:pre-wrap; color:var(--dim);
                 display:flex; gap:10px; align-items:flex-start }
  .recap-panel span { flex:1 }
  button.regen { padding:2px 8px; font-size:14px; flex:none }
  button { background:var(--panel-2); color:var(--text); border:1px solid var(--border);
           border-radius:8px; padding:4px 12px; cursor:pointer;
           transition:border-color .12s ease }
  button:hover { border-color:var(--dim) }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Claude Sessions</h1>
    <input id="nameFilter" placeholder="Filter by name…">
    <label class="toggle"><input type="checkbox" id="liveOnly"> live only</label>
    <span class="counts" id="counts"></span>
  </div>
  <div class="filter-row">
    <span class="row-label">Groups</span>
    <div class="pills" id="groupPills"></div>
  </div>
  <div class="filter-row">
    <span class="row-label">Projects</span>
    <div class="pills" id="projectPills"></div>
  </div>
</header>
<main>
<div class="card">
<table>
  <thead><tr><th>Status</th><th>Project</th><th>Name</th><th>ID</th><th>Last activity</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</main>
<script>
let sessions = [];
const recaps = {};            // sessionId -> {state:'loading'|'done'|'error', text}
const openRecaps = new Set(); // sessionIds with expanded recap panel

const $ = id => document.getElementById(id);
const shortProject = p => p ? p.split('/').filter(Boolean).pop() : '?';
const selectedProjects = new Set(); // empty = all projects
let groups = {};                    // group name -> [project paths], server-persisted
let editMode = false;
let activeEditGroup = null;

async function putGroups() {
  try {
    const res = await fetch('/api/groups', { method: 'PUT', body: JSON.stringify(groups) });
    if (!res.ok) console.error('saving groups failed:', await res.text());
  } catch (e) { console.error('saving groups failed:', e); }
}

function relTime(ms) {
  if (!ms) return '—';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function render() {
  const q = $('nameFilter').value.toLowerCase();
  const liveOnly = $('liveOnly').checked;
  const filtered = sessions.filter(s =>
    (!q || (s.name || '').toLowerCase().includes(q)) &&
    (!selectedProjects.size || selectedProjects.has(s.project)) &&
    (!liveOnly || s.status !== 'ended'));

  $('rows').replaceChildren(...filtered.flatMap(s => {
    const tr = document.createElement('tr');
    tr.className = s.status;

    const tdStatus = document.createElement('td');
    tdStatus.append(Object.assign(document.createElement('span'), { className: 'dot' }), s.status);

    const tdName = document.createElement('td');
    tdName.textContent = s.name || '';

    const tdProj = document.createElement('td');
    tdProj.textContent = shortProject(s.project);
    tdProj.title = s.project || '';

    const tdId = document.createElement('td');
    const idSpan = Object.assign(document.createElement('span'),
      { className: 'id', textContent: s.sessionId.slice(0, 8), title: 'Click to copy ' + s.sessionId });
    idSpan.onclick = () => navigator.clipboard.writeText(s.sessionId);
    tdId.append(idSpan);

    const tdTime = document.createElement('td');
    tdTime.className = 'time';
    tdTime.textContent = relTime(s.lastActivity);

    const tdBtn = document.createElement('td');
    const btn = Object.assign(document.createElement('button'), { textContent: 'Recap' });
    btn.onclick = () => toggleRecap(s.sessionId);
    tdBtn.append(btn);

    tr.append(tdStatus, tdProj, tdName, tdId, tdTime, tdBtn);
    const out = [tr];

    if (openRecaps.has(s.sessionId)) {
      const r = recaps[s.sessionId];
      const tr2 = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 6;
      const div = Object.assign(document.createElement('div'), { className: 'recap-panel' });
      const text = Object.assign(document.createElement('span'), {
        textContent: !r || r.state === 'loading' ? 'Generating recap…'
          : r.state === 'error' ? 'Error: ' + r.text : r.text });
      div.append(text);
      if (r && r.state !== 'loading') {
        const regen = Object.assign(document.createElement('button'),
          { className: 'regen', textContent: '↻', title: 'Regenerate recap' });
        regen.onclick = () => generateRecap(s.sessionId, true);
        div.append(regen);
      }
      td.append(div); tr2.append(td); out.push(tr2);
    }
    return out;
  }));

  const live = sessions.filter(s => s.status !== 'ended').length;
  $('counts').textContent = `${live} live / ${sessions.length} total`;
}

async function generateRecap(id, force = false) {
  recaps[id] = { state: 'loading' };
  render();
  try {
    const res = await fetch('/api/recap/' + encodeURIComponent(id) + (force ? '?force=1' : ''),
      { method: 'POST' });
    const body = await res.json();
    recaps[id] = res.ok ? { state: 'done', text: body.recap }
                        : { state: 'error', text: body.error };
  } catch (e) {
    recaps[id] = { state: 'error', text: String(e) };
  }
  render();
}

async function toggleRecap(id) {
  if (openRecaps.has(id)) { openRecaps.delete(id); return render(); }
  openRecaps.add(id);
  if (!recaps[id] || recaps[id].state === 'error') return generateRecap(id);
  render();
}

function renderPills(projects) {
  const rerender = () => { renderPills(projects); render(); };

  // Groups row
  const groupPills = [];
  for (const name of Object.keys(groups).sort()) {
    const members = groups[name];
    const allSelected = members.length > 0 && members.every(m => selectedProjects.has(m));
    const pill = Object.assign(document.createElement('button'), {
      className: 'pill group'
        + (editMode && activeEditGroup === name ? ' editing' : '')
        + (!editMode && allSelected ? ' active' : ''),
      title: members.map(shortProject).join(', ') || 'empty group',
    });
    pill.append(`${name} · ${members.length}`);
    if (editMode) {
      const x = Object.assign(document.createElement('span'), { className: 'x', textContent: '×' });
      x.onclick = e => {
        e.stopPropagation();
        if (confirm(`Delete group "${name}"?`)) {
          delete groups[name];
          if (activeEditGroup === name) activeEditGroup = null;
          putGroups(); rerender();
        }
      };
      pill.append(x);
    }
    pill.onclick = () => {
      if (editMode) {
        activeEditGroup = activeEditGroup === name ? null : name;
      } else if (allSelected) {
        members.forEach(m => selectedProjects.delete(m));
      } else {
        members.forEach(m => selectedProjects.add(m));
      }
      rerender();
    };
    groupPills.push(pill);
  }

  if (editMode) {
    const add = Object.assign(document.createElement('button'),
      { className: 'pill group', textContent: '+ New group' });
    add.onclick = () => {
      const name = (prompt('Group name') || '').trim();
      if (!name) return;
      if (groups[name]) { activeEditGroup = name; return rerender(); }
      groups[name] = [];
      activeEditGroup = name;
      putGroups(); rerender();
    };
    groupPills.push(add);
  } else if (!groupPills.length) {
    groupPills.push(Object.assign(document.createElement('span'),
      { className: 'hint', textContent: 'No groups yet — use Edit to create one' }));
  }

  // Edit toggle (a plain button, not a pill), after the last group pill
  const edit = Object.assign(document.createElement('button'), {
    className: 'edit-toggle' + (editMode ? ' active' : ''),
    textContent: editMode ? '✓ Done' : '✎ Edit',
    title: editMode ? 'Finish editing groups' : 'Edit project groups',
  });
  edit.onclick = () => {
    editMode = !editMode;
    activeEditGroup = null;
    rerender();
  };
  groupPills.push(edit);
  $('groupPills').replaceChildren(...groupPills);

  // Projects row
  const pills = [];
  const allPill = Object.assign(document.createElement('button'),
    { className: 'pill' + (selectedProjects.size ? '' : ' active'), textContent: 'All' });
  allPill.onclick = () => { selectedProjects.clear(); rerender(); };
  pills.push(allPill);

  for (const p of projects) {
    const inGroup = editMode && activeEditGroup && groups[activeEditGroup].includes(p);
    const pill = Object.assign(document.createElement('button'), {
      className: 'pill'
        + (!editMode && selectedProjects.has(p) ? ' active' : '')
        + (inGroup ? ' member' : ''),
      textContent: shortProject(p), title: p,
    });
    pill.onclick = () => {
      if (editMode) {
        if (!activeEditGroup) return;
        const members = groups[activeEditGroup];
        const i = members.indexOf(p);
        i >= 0 ? members.splice(i, 1) : members.push(p);
        putGroups();
      } else {
        selectedProjects.has(p) ? selectedProjects.delete(p) : selectedProjects.add(p);
      }
      rerender();
    };
    pills.push(pill);
  }
  $('projectPills').replaceChildren(...pills);
}

function setSessions(list) {
  sessions = list;
  const projects = [...new Set(list.map(s => s.project).filter(Boolean))].sort();
  for (const p of selectedProjects) if (!projects.includes(p)) selectedProjects.delete(p);
  renderPills(projects);
  render();
}

async function load() { setSessions(await (await fetch('/api/sessions')).json()); }

(async function loadGroups() {
  try {
    groups = await (await fetch('/api/groups')).json();
    setSessions(sessions); // re-render pills now that groups are known
  } catch (e) { console.error('loading groups failed:', e); }
})();

$('nameFilter').oninput = render;
$('liveOnly').onchange = render;

const es = new EventSource('/api/events');       // auto-reconnects on drop
es.onmessage = e => setSessions(JSON.parse(e.data));
es.onopen = () => load();                        // re-sync after (re)connect
load();
setInterval(render, 30000);                      // keep relative times fresh
</script>
</body>
</html>
